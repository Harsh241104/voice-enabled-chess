<svg xmlns="http://www.w3.org/2000/svg" width="560" height="740" viewBox="0 0 560 740" role="img" aria-labelledby="title description">
  <title id="title">Just Chess game preview</title>
  <desc id="description">A chessboard with the starting pieces, Play Again and Start Voice Command buttons, and a move history panel.</desc>
  <defs>
    <pattern id="squares" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#f0d9b5"/>
      <rect x="50" width="50" height="50" fill="#b58863"/>
      <rect y="50" width="50" height="50" fill="#b58863"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity=".18"/>
    </filter>
  </defs>
